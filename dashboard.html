<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RQ-IT · Dashboard de Solicitudes</title>
<style>
  :root{
    --brand:#7c3aed; --brand-2:#6d28d9; --brand-soft:#f5f3ff;
    --bg:#f6f7fb; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e6e8ef;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --radius:16px; --ok:#16a34a; --err:#dc2626;
    --grad:linear-gradient(135deg,#7c3aed 0%,#a855f7 100%);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0b1020;--panel:#131a2c;--brand-soft:#1e1b3a;--ink:#e8ecf6;--muted:#94a3b8;--line:#243049;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.35)}
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

  .appbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .appbar .inner{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none;box-shadow:0 4px 12px rgba(124,58,237,.35)}
  .brand-t{display:flex;flex-direction:column;line-height:1.15}
  .brand-t b{font-size:15px;font-weight:700}.brand-t span{font-size:12px;color:var(--muted)}
  .grow{flex:1}
  .userchip{display:flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand-2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .userchip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .ghostlink{color:var(--muted);text-decoration:none;font-size:13px;padding:8px 12px;border-radius:10px}
  .ghostlink:hover{background:var(--brand-soft);color:var(--brand-2)}

  .wrap{max-width:1240px;margin:0 auto;padding:22px}
  .page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .page-h h1{font-size:22px;margin:0;font-weight:750;letter-spacing:-.01em}
  .page-h p{margin:4px 0 0;color:var(--muted);font-size:13px}

  .tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
  .tab{border:none;background:transparent;color:var(--muted);font-weight:650;font-size:13.5px;padding:9px 16px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
  .tab .badge{background:rgba(0,0,0,.12);border-radius:999px;padding:1px 8px;font-size:11.5px}
  .tab.active .badge{background:rgba(255,255,255,.25)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .kpi.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(124,58,237,.18)}
  .kpi .n{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:7px}
  .kpi .accent{width:9px;height:9px;border-radius:3px;flex:none}
  .kpi.total .n{color:var(--brand-2)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{position:relative;flex:1;min-width:240px;max-width:420px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;background:var(--panel);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
  select.filter{padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;background:var(--panel);color:var(--ink)}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 15px;font-size:13.5px;cursor:pointer;font-weight:600;transition:background .12s ease}
  .btn:hover{background:var(--brand-soft)}
  .count{color:var(--muted);font-size:13px;font-weight:600}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;min-width:940px}
  thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:14px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s ease}
  tbody tr:hover{background:var(--brand-soft)}
  td .title{font-weight:650}
  td .sub{color:var(--muted);font-size:12px;margin-top:2px}
  td input,td select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--panel);color:var(--ink)}
  td input:focus,td select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,58,237,.14)}
  td input[type=text]{min-width:140px}
  .mono{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
  .chip{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--brand-soft);color:var(--brand-2);margin:1px 3px 1px 0}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .crit{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700}

  .save-msg{font-size:11.5px;margin-top:5px;min-height:14px}
  .save-msg.ok{color:var(--ok)} .save-msg.err{color:var(--err)}
  .row-saved{animation:flash 1.3s ease}
  @keyframes flash{0%{background:rgba(22,163,74,.14)}100%{background:transparent}}
  .state{padding:54px 20px;text-align:center;color:var(--muted)}
  .state .big{font-size:34px;margin-bottom:8px}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err-txt{color:var(--err)}
  @media (max-width:640px){ .wrap{padding:14px} .appbar .inner{padding:10px 14px} .brand-t span{display:none} }
</style>
</head>
<body>

<div class="appbar">
  <div class="inner">
    <div class="logo">RQ</div>
    <div class="brand-t"><b>RQ-IT</b><span>Solicitudes de Infraestructura y ERP</span></div>
    <div class="grow"></div>
    <span class="userchip" id="user"><span class="dot"></span><span id="userName">…</span></span>
    <a class="ghostlink" href="/index.html">Nueva infraestructura</a>
    <a class="ghostlink" href="/erp.html">Nueva ERP</a>
    <a class="ghostlink" href="/.auth/logout">Salir</a>
  </div>
</div>

<datalist id="usuariosDL"></datalist>

<div class="wrap">
  <div class="page-h">
    <div>
      <h1>Dashboard de seguimiento</h1>
      <p>Estado, responsable y fecha de entrega de cada solicitud.</p>
    </div>
    <button class="btn" id="btnRefresh">Actualizar</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-type="infra">Infraestructura <span class="badge" id="cnt-infra">·</span></button>
    <button class="tab" data-type="erp">Sistemas / ERP <span class="badge" id="cnt-erp">·</span></button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="q" placeholder="Buscar…">
    </div>
    <select class="filter" id="fEstado">
      <option value="">Todos los estados</option>
      <option>Nuevo</option><option>En revisión</option><option>Aprobado</option>
      <option>En provisión</option><option>Completado</option><option>Rechazado</option>
    </select>
    <div class="grow"></div>
    <span class="count" id="count"></span>
  </div>

  <div class="card">
    <div class="tablewrap">
      <table id="tbl">
        <thead id="thead"></thead>
        <tbody id="tbody">
          <tr><td><div class="state"><div class="spinner"></div>Cargando…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var ESTADOS = ["Nuevo","En revisión","Aprobado","En provisión","Completado","Rechazado"];
  var COLORS = {
    "Nuevo":["#4f46e5","rgba(79,70,229,.14)"],"En revisión":["#b45309","rgba(217,119,6,.16)"],
    "Aprobado":["#15803d","rgba(22,163,74,.16)"],"En provisión":["#0369a1","rgba(3,105,161,.16)"],
    "Completado":["#047857","rgba(4,120,87,.16)"],"Rechazado":["#b91c1c","rgba(220,38,38,.16)"]
  };
  var CRIT = {"Alta":["#b91c1c","rgba(220,38,38,.14)"],"Media":["#b45309","rgba(217,119,6,.16)"],"Baja":["#15803d","rgba(22,163,74,.14)"]};

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(v){ if(!v) return ''; var d=new Date(v); return isNaN(d)?'' : d.toISOString().slice(0,10); }
  function colorOf(e){ return COLORS[e] || ["#475569","rgba(100,116,139,.14)"]; }
  function pill(e){ var c=colorOf(e); return '<span class="pill" style="color:'+c[0]+';background:'+c[1]+'"><span class="d" style="background:'+c[0]+'"></span>'+esc(e||'—')+'</span>'; }
  function crit(c){ if(!c) return '—'; var col=CRIT[c]||["#475569","rgba(100,116,139,.14)"]; return '<span class="crit" style="color:'+col[0]+';background:'+col[1]+'">'+esc(c)+'</span>'; }
  function chips(csv){ if(!csv) return '—'; return String(csv).split(/\s*,\s*/).filter(Boolean).map(function(m){return '<span class="chip">'+esc(m)+'</span>';}).join(''); }

  /* trailing edit columns shared by both types */
  function editCells(it){
    var estadoOpts = ESTADOS.map(function(e){ return '<option'+(e===it.Estado?' selected':'')+'>'+esc(e)+'</option>'; }).join('');
    return '<td><div style="margin-bottom:6px">'+pill(it.Estado)+'</div><select class="e-estado">'+estadoOpts+'</select></td>'+
      '<td><input type="text" class="e-resp" list="usuariosDL" autocomplete="off" value="'+esc(it.Responsable||'')+'" placeholder="Asignar…"></td>'+
      '<td><input type="date" class="e-fecha" value="'+esc(fmtDate(it.FechaEntrega))+'"></td>'+
      '<td><button class="btn primary sm e-save" style="padding:7px 12px">Guardar</button><div class="save-msg e-msg"></div></td>';
  }

  var TYPES = {
    infra: {
      api: "/api/solicitudes",
      searchPh: "Buscar aplicación, proyecto, identificador…",
      headers: ["Id","Solicitud","Ambiente","Criticidad","Recursos","Estado","Responsable","Fecha entrega",""],
      row: function(it){
        var titulo = it.Titulo || it.Aplicacion || ('#'+it.Id);
        var rec=[]; if(it.CPURequerida!=null)rec.push(it.CPURequerida+' vCPU'); if(it.RAMRequeridaGB!=null)rec.push(it.RAMRequeridaGB+' GB'); if(it.StorageGB!=null)rec.push(it.StorageGB+' GB disco');
        return '<td><span class="mono">#'+it.Id+'</span><div class="sub">'+esc(fmtDate(it.FechaRegistro))+'</div></td>'+
          '<td><div class="title">'+esc(titulo)+'</div>'+(it.Proyecto?('<div class="sub">'+esc(it.Proyecto)+(it.LiderProyecto?(' · '+esc(it.LiderProyecto)):'')+'</div>'):'')+'</td>'+
          '<td>'+esc(it.Ambiente||'—')+'</td>'+
          '<td>'+crit(it.Criticidad)+'</td>'+
          '<td class="mono">'+esc(rec.join(' · ')||'—')+'</td>'+
          editCells(it);
      }
    },
    erp: {
      api: "/api/solicitudes-erp",
      searchPh: "Buscar solicitante, área, módulos…",
      headers: ["Id","Solicitud","Módulos","Fabric","Prioridad","Estado","Responsable","Fecha entrega",""],
      row: function(it){
        var titulo = it.Titulo || it.Area || ('#'+it.Id);
        return '<td><span class="mono">#'+it.Id+'</span><div class="sub">'+esc(fmtDate(it.FechaRegistro))+'</div></td>'+
          '<td><div class="title">'+esc(titulo)+'</div>'+(it.Solicitante?('<div class="sub">'+esc(it.Solicitante)+(it.Area?(' · '+esc(it.Area)):'')+'</div>'):'')+'</td>'+
          '<td>'+chips(it.Modulos)+'</td>'+
          '<td>'+(it.TransformarFabric==='Sí'?'<span class="crit" style="color:#0369a1;background:rgba(3,105,161,.14)">Sí</span>':'—')+'</td>'+
          '<td>'+crit(it.Prioridad)+'</td>'+
          editCells(it);
      }
    }
  };

  var currentType = "infra";
  var tbody = document.getElementById('tbody');
  var thead = document.getElementById('thead');

  fetch('/.auth/me').then(function(r){return r.json();}).then(function(d){
    var p=d&&d.clientPrincipal; document.getElementById('userName').textContent = p?(p.userDetails||'usuario'):'invitado';
  }).catch(function(){ document.getElementById('userName').textContent=''; });

  /* Usuarios del directorio (Entra) para el selector de Responsable */
  (function loadUsuarios(){
    var dl = document.getElementById('usuariosDL');
    fetch('/api/usuarios').then(function(r){ return r.ok?r.json():null; }).then(function(d){
      if(!d || !d.ok || !d.items) return;
      dl.innerHTML = d.items.map(function(u){
        var v = String(u.name||'').replace(/"/g,'&quot;');
        var lbl = String(u.email||u.jobTitle||'').replace(/"/g,'&quot;');
        return '<option value="'+v+'"'+(lbl?(' label="'+lbl+'"'):'')+'></option>';
      }).join('');
    }).catch(function(){});
  })();

  function colspan(){ return TYPES[currentType].headers.length; }
  function setState(html){ tbody.innerHTML='<tr><td colspan="'+colspan()+'">'+html+'</td></tr>'; }
  function renderHead(){ thead.innerHTML='<tr>'+TYPES[currentType].headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>'; }

  function renderKpis(items){
    var counts={}; ESTADOS.forEach(function(e){counts[e]=0;});
    items.forEach(function(it){ if(counts[it.Estado]==null)counts[it.Estado]=0; counts[it.Estado]++; });
    var active = document.getElementById('fEstado').value;
    var box=document.getElementById('kpis');
    var html='<div class="kpi total'+(active===''?' active':'')+'" data-e=""><div class="n">'+items.length+'</div><div class="l">Total</div></div>';
    ESTADOS.forEach(function(e){ var c=colorOf(e);
      html+='<div class="kpi'+(active===e?' active':'')+'" data-e="'+esc(e)+'"><div class="n" style="color:'+c[0]+'">'+(counts[e]||0)+'</div><div class="l"><span class="accent" style="background:'+c[0]+'"></span>'+esc(e)+'</div></div>';
    });
    box.innerHTML=html;
    Array.prototype.forEach.call(box.querySelectorAll('.kpi'), function(k){
      k.addEventListener('click', function(){ document.getElementById('fEstado').value=k.getAttribute('data-e'); load(); });
    });
  }

  function bindRow(tr, it){
    var sel=tr.querySelector('.e-estado');
    sel.addEventListener('change', function(){ var p=tr.querySelector('.pill'),c=colorOf(sel.value); p.style.color=c[0];p.style.background=c[1]; p.innerHTML='<span class="d" style="background:'+c[0]+'"></span>'+esc(sel.value); });
    tr.querySelector('.e-save').addEventListener('click', function(){
      var btn=this,msg=tr.querySelector('.e-msg');
      var payload={ estado:sel.value, responsable:tr.querySelector('.e-resp').value.trim(), fechaEntrega:tr.querySelector('.e-fecha').value||null };
      btn.disabled=true; msg.textContent='Guardando…'; msg.className='save-msg';
      fetch(TYPES[currentType].api+'/'+it.Id, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){return {ok:r.ok,d:d};}); })
        .then(function(res){ btn.disabled=false;
          if(res.ok&&res.d&&res.d.ok){ msg.textContent='✓ Guardado'; msg.className='save-msg ok'; it.Estado=payload.estado;
            tr.classList.remove('row-saved'); void tr.offsetWidth; tr.classList.add('row-saved'); setTimeout(function(){msg.textContent='';},2500);
          } else { msg.textContent='✗ '+((res.d&&res.d.error)||'Error'); msg.className='save-msg err'; }
        })
        .catch(function(){ btn.disabled=false; msg.textContent='✗ Sin conexión'; msg.className='save-msg err'; });
    });
  }

  function load(){
    var cfg=TYPES[currentType];
    var q=document.getElementById('q').value.trim(), estado=document.getElementById('fEstado').value;
    var url=cfg.api+'?'; if(estado)url+='estado='+encodeURIComponent(estado)+'&'; if(q)url+='q='+encodeURIComponent(q);
    renderHead(); setState('<div class="state"><div class="spinner"></div>Cargando…</div>');
    fetch(url).then(function(r){
      if(r.status===401){ location.href='/.auth/login/aad?post_login_redirect_uri='+encodeURIComponent(location.pathname); return null; }
      return r.json();
    }).then(function(d){
      if(!d) return;
      if(!d.ok){ document.getElementById('kpis').innerHTML=''; setState('<div class="state err-txt">'+esc(d.error||'No se pudo cargar')+(d.debug?('<div class="sub" style="margin-top:6px">'+esc(d.debug.message)+'</div>'):'')+'</div>'); return; }
      var items=d.items||[];
      renderKpis(items);
      document.getElementById('count').textContent=items.length+' solicitud(es)';
      document.getElementById('cnt-'+currentType).textContent=items.length;
      if(!items.length){ setState('<div class="state">No hay solicitudes que coincidan.</div>'); return; }
      tbody.innerHTML='';
      items.forEach(function(it){ var tr=document.createElement('tr'); tr.innerHTML=cfg.row(it); tbody.appendChild(tr); bindRow(tr,it); });
    }).catch(function(){ setState('<div class="state err-txt">Error de red al consultar la API.</div>'); });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){
      if(t.classList.contains('active')) return;
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      currentType=t.getAttribute('data-type');
      document.getElementById('q').value='';
      document.getElementById('q').placeholder=TYPES[currentType].searchPh;
      document.getElementById('fEstado').value='';
      load();
    });
  });
  document.getElementById('btnRefresh').addEventListener('click', load);
  document.getElementById('fEstado').addEventListener('change', load);
  var t=null; document.getElementById('q').addEventListener('input', function(){ clearTimeout(t); t=setTimeout(load,400); });

  document.getElementById('q').placeholder=TYPES.infra.searchPh;
  load();
})();
</script>
</body>
</html>
